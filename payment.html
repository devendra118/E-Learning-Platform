<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - eLearning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">eLearning</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="courses.html">Courses</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
        <div class="d-flex">
          <a href="login.html" class="btn btn-light me-2"><i class="bi bi-box-arrow-in-right me-2"></i>Login</a>
          <a href="login.html" class="btn btn-success"><i class="bi bi-person-plus me-2"></i>Sign Up</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row">
      <div class="col-md-8">
        <div class="card mb-4">
          <div class="card-header bg-primary text-white">
            <h4>Complete Your Purchase</h4>
          </div>
          <div class="card-body">
            <form id="payment-form">
              <div class="mb-3">
                <label class="form-label">Payment Method</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="card-payment" value="card" checked>
                  <label class="form-check-label" for="card-payment">Credit/Debit Card</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="upi-payment" value="upi">
                  <label class="form-check-label" for="upi-payment">UPI</label>
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="netbanking-payment" value="netbanking">
                  <label class="form-check-label" for="netbanking-payment">Net Banking</label>
                </div>
              </div>

              <!-- Card Payment Section -->
              <div id="card-section">
                <div class="mb-3">
                  <label for="card-name" class="form-label">Name on Card</label>
                  <input type="text" class="form-control" id="card-name" required>
                </div>
                <div class="mb-3">
                  <label for="card-number" class="form-label">Card Number</label>
                  <input type="text" class="form-control" id="card-number" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="card-expiry" class="form-label">Expiry Date</label>
                    <input type="text" class="form-control" id="card-expiry" placeholder="MM/YY" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="card-cvc" class="form-label">CVC</label>
                    <input type="text" class="form-control" id="card-cvc" placeholder="123" required>
                  </div>
                </div>
              </div>

              <!-- UPI Payment Section -->
              <div id="upi-section" class="d-none">
                <div class="mb-3">
                  <label for="upi-id" class="form-label">UPI ID</label>
                  <input type="text" class="form-control" id="upi-id" placeholder="yourname@upi">
                  <small class="text-muted">Example: name@bankname</small>
                </div>
              </div>

              <!-- Net Banking Section -->
              <div id="netbanking-section" class="d-none">
                <div class="mb-3">
                  <label for="bank-select" class="form-label">Select Bank</label>
                  <select class="form-select" id="bank-select">
                    <option selected disabled>Choose your bank</option>
                    <option value="sbi">State Bank of India</option>
                    <option value="hdfc">HDFC Bank</option>
                    <option value="icici">ICICI Bank</option>
                    <option value="axis">Axis Bank</option>
                    <option value="kotak">Kotak Mahindra Bank</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100" id="pay-button">Pay Now</button>
            </form>

            <!-- UPI QR Code Section -->
            <div id="upi-qr-section" class="d-none">
              <h5>Scan the QR Code to complete your payment</h5>
              <canvas id="upi-qr-code"></canvas>
              <div id="timer" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h4>Order Summary</h4>
          </div>
          <div class="card-body">
            <h5 id="course-title" class="card-title">Course Name</h5>
            <hr>
            <div class="d-flex justify-content-between mb-2">
              <span>Price:</span>
              <span id="course-price">₹999</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span>Tax:</span>
              <span>₹99</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between fw-bold">
              <span>Total:</span>
              <span id="total-price">₹1098</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-light">
    <p class="mb-0 py-3">&copy; 2025 eLearning. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Get course details from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const courseName = urlParams.get('course') || 'Selected Course';
    const coursePrice = urlParams.get('price') || '999';

    // Update order summary
    document.getElementById('course-title').textContent = courseName;
    document.getElementById('course-price').textContent = `₹${coursePrice}`;
    document.getElementById('total-price').textContent = `₹${parseInt(coursePrice) + 99}`;

    // Input masking and validation
    document.getElementById('card-number').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/g, '');
      if (value.length > 16) value = value.substr(0, 16);
      value = value.replace(/(\d{4})/g, '$1 ').trim();
      e.target.value = value;
      validateCardNumber(value);
    });

    document.getElementById('card-expiry').addEventListener('input', function(e) {
      let value = e.target.value.replace(/[^0-9]/g, '');
      if (value.length > 2) {
        value = value.substr(0, 2) + '/' + value.substr(2, 2);
      }
      if (value.length > 5) value = value.substr(0, 5);
      e.target.value = value;
      validateExpiryDate(value);
    });

    document.getElementById('card-cvc').addEventListener('input', function(e) {
      let value = e.target.value.replace(/[^0-9]/g, '');
      if (value.length > 4) value = value.substr(0, 4);
      e.target.value = value;
      validateCVC(value);
    });

    function validateCardNumber(number) {
      const isValid = number.replace(/\s/g, '').length === 16;
      setValidationState('card-number', isValid);
      return isValid;
    }

    function validateExpiryDate(date) {
      const [month, year] = date.split('/');
      const currentYear = new Date().getFullYear() % 100;
      const currentMonth = new Date().getMonth() + 1;
      
      const isValid = month && year && 
                     month >= 1 && month <= 12 && 
                     (year > currentYear || (year == currentYear && month >= currentMonth));
      setValidationState('card-expiry', isValid);
      return isValid;
    }

    function validateCVC(cvc) {
      const isValid = cvc.length >= 3 && cvc.length <= 4;
      setValidationState('card-cvc', isValid);
      return isValid;
    }

    function setValidationState(fieldId, isValid) {
      const field = document.getElementById(fieldId);
      if (isValid) {
        field.classList.remove('is-invalid');
        field.classList.add('is-valid');
      } else {
        field.classList.remove('is-valid');
        field.classList.add('is-invalid');
      }
    }

    document.getElementById('payment-form').addEventListener('submit', function(e) {
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      
      if (paymentMethod === 'card') {
        const cardNumberValid = validateCardNumber(document.getElementById('card-number').value);
        const expiryValid = validateExpiryDate(document.getElementById('card-expiry').value);
        const cvcValid = validateCVC(document.getElementById('card-cvc').value);
        
        if (!cardNumberValid || !expiryValid || !cvcValid) {
          e.preventDefault();
          alert('Please correct the highlighted fields');
          return;
        }
        // Process card payment
        processPayment();
      } 
      else if (paymentMethod === 'upi') {
        e.preventDefault();
        const upiId = document.getElementById('upi-id').value;
        if (!upiId || !upiId.includes('@')) {
          alert('Please enter a valid UPI ID');
          return;
        }
        showUPIPayment(upiId);
      }
      else if (paymentMethod === 'netbanking') {
        e.preventDefault();
        const bank = document.getElementById('bank-select').value;
        if (!bank) {
          alert('Please select your bank');
          return;
        }
        processNetBankingPayment(bank);
      }
    });

    // Initialize payment method sections
    document.getElementById('card-section').classList.remove('d-none');
    document.getElementById('upi-section').classList.add('d-none');
    document.getElementById('netbanking-section').classList.add('d-none');
    document.getElementById('upi-qr-section').classList.add('d-none');

    // Payment method change handler
    document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
      radio.addEventListener('change', function() {
        // Hide all sections first
        document.getElementById('card-section').classList.add('d-none');
        document.getElementById('upi-section').classList.add('d-none');
        document.getElementById('netbanking-section').classList.add('d-none');
        document.getElementById('upi-qr-section').classList.add('d-none');
        
        // Show selected section
        if (this.value === 'card') {
          document.getElementById('card-section').classList.remove('d-none');
        } 
        else if (this.value === 'upi') {
          document.getElementById('upi-section').classList.remove('d-none');
        }
        else if (this.value === 'netbanking') {
          document.getElementById('netbanking-section').classList.remove('d-none');
        }
      });

      // Trigger change event for initially checked radio
      if (radio.checked) {
        radio.dispatchEvent(new Event('change'));
      }
    });

    function showUPIPayment(upiId) {
      // Generate QR code
      const qr = new QRious({
        element: document.getElementById('upi-qr-code'),
        value: `upi://pay?pa=${upiId}&pn=eLearning&am=${document.getElementById('total-price').textContent.replace('₹','')}`,
        size: 200
      });
      
      // Show QR section
      document.getElementById('upi-qr-section').classList.remove('d-none');
      
      // Start timer
      let timeLeft = 300; // 5 minutes
      const timer = document.getElementById('timer');
      timer.innerHTML = `Time remaining: 5:00`;
      
      const countdown = setInterval(() => {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timer.innerHTML = `Time remaining: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timer.innerHTML = 'Payment timed out';
          setTimeout(() => {
            document.getElementById('upi-qr-section').classList.add('d-none');
            alert('Payment timed out. Please try again.');
          }, 2000);
        }
      }, 1000);
      
      // Simulate payment completion (in real app this would be via webhook)
      setTimeout(() => {
        if (Math.random() > 0.2) { // 80% success rate
          clearInterval(countdown);
          timer.innerHTML = 'Payment successful!';
          setTimeout(() => {
            processPayment();
          }, 1500);
        }
      }, 5000);
    }

    function processNetBankingPayment(bank) {
      alert(`Redirecting to ${bank} net banking...`);
      // In real app would redirect to bank's payment gateway
      setTimeout(() => {
        processPayment();
      }, 2000);
    }

    function processPayment() {
      alert('Payment processed successfully! Thank you for your purchase.');
      // In real app would submit form or redirect to success page
    }
  </script>
</body>

</html>
